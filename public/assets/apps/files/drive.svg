<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- generic disk: Files › This device, used when a drive has no .ico of its own -->
  <defs>
    <linearGradient id="top" x1="32" y1="20" x2="32" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBFCFD"/>
      <stop offset="1" stop-color="#E3E7ED"/>
    </linearGradient>
    <linearGradient id="front" x1="32" y1="31" x2="32" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5DAE2"/>
      <stop offset="1" stop-color="#AEB6C2"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="32" cy="50.5" rx="25" ry="2.5" fill="#0A1E46" fill-opacity=".14"/>
  <!-- top face, a little perspective -->
  <path d="M12.5 19.5h39a3 3 0 0 1 2.7 1.7l4.3 9.3H5.5l4.3-9.3a3 3 0 0 1 2.7-1.7z" fill="url(#top)" stroke="#8D96A3" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- front -->
  <rect x="5.5" y="30.5" width="53" height="17" rx="3" fill="url(#front)" stroke="#8D96A3" stroke-width="1.2"/>
  <path d="M7 32h50" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
  <!-- slot and activity light -->
  <rect x="12" y="37.5" width="24" height="3.2" rx="1.6" fill="#5E6876" fill-opacity=".75"/>
  <circle cx="50" cy="39.1" r="2.4" fill="#3DBB7E"/>
  <circle cx="50" cy="39.1" r="2.4" fill="none" stroke="#1E8A57" stroke-opacity=".6" stroke-width=".8"/>
  <circle cx="49.3" cy="38.4" r=".7" fill="#fff" fill-opacity=".8"/>
</svg>
